# Put this file in your GitHub repo at: .github/workflows/padel-watch.yml
name: Padel watch

on:
  schedule:
    - cron: "*/10 5-21 * * *"   # every 10 min, 05:00–21:59 UTC
  workflow_dispatch:            # lets you press "Run" manually

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Remembers which slots you've already been told about between runs
      - uses: actions/cache@v4
        with:
          path: seen_slots.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - run: python padel_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
